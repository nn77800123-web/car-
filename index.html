<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#C41E26;--bd:#e5e7eb;--rd:#dc2626;--gr:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b3;--bd:#2c333b;--pr:#E5484D}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b3;--bd:#2c333b;--pr:#E5484D}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
header{padding:14px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
main{padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:4px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g{color:var(--gr)}.r{color:var(--rd)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mu);padding:10px 9px;font-size:11px;font-family:inherit}
nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-size:15px;font-family:inherit;box-shadow:0 4px 12px #0004}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:90%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:16px;margin-top:14px;font-family:inherit}
.btn.s{background:var(--bd);color:var(--tx);margin-top:8px}.btn.d{background:var(--rd)}
.sm{border:0;background:var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13px}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none}.al{border-color:var(--rd)}.al div{margin-top:5px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}
.empty{text-align:center;color:var(--mu);padding:30px}
</style>
</head>

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let PROF={role:null,name:"",email:""};
const collection=k=>({
  doc:id=>({
    set:async o=>{const {error}=await sb.from("docs").upsert({col:k,id,data:o,updated_at:new Date().toISOString()});if(error)throw error},
    delete:async()=>{const {error}=await sb.from("docs").delete().eq("col",k).eq("id",id);if(error)throw error}
  }),
  onSnapshot:(cb,eb)=>{const m=new Map(),emit=()=>cb({docs:[...m].map(([id,d])=>({id,data:()=>d}))});
    sb.from("docs").select("id,data").eq("col",k).then(({data,error})=>{if(error){eb&&eb(error);return}data.forEach(r=>m.set(r.id,r.data));emit()});
    sb.channel("c-"+k).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+k},p=>{
      if(p.eventType==="DELETE"){if(p.old.col===k)m.delete(p.old.id)}else m.set(p.new.id,p.new.data);emit()}).subscribe()}
});
const claude={use:async n=>{
  if(n==="db")return{collection};
  if(n==="assets")return{upload:async b=>{const path=crypto.randomUUID()+".jpg";const {error}=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(error)throw error;return{id:path}}};
  if(n==="downloads")return{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  if(n==="user")return{canEdit:async()=>["owner","admin"].includes(PROF.role),isOwner:async()=>PROF.role==="owner",me:async()=>({name:PROF.name,email:PROF.email})};
}};
const SU={};
async function hyd(){for(const i of document.querySelectorAll("img[data-p]:not([src])")){const p=i.dataset.p;if(!SU[p]){const {data}=await sb.storage.from("photos").createSignedUrl(p,3600);SU[p]=data?.signedUrl}if(SU[p])i.src=SU[p]}}
new MutationObserver(()=>hyd()).observe(document.documentElement,{childList:true,subtree:true});
async function logout(){await sb.auth.signOut();location.reload()}
function login(){
  document.getElementById("md").innerHTML='<div class="modal" style="align-items:center;padding:20px"><div class="sheet" style="border-radius:16px"><b>تسجيل الدخول — AUTODRIVE</b><label>الإيميل</label><input id="le" type="email" autocomplete="username"><label>الباسورد</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" id="lb">دخول</button><div class="mu" id="lm" style="margin-top:8px"></div></div></div>';
  document.getElementById("lb").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.getElementById("le").value.trim(),password:document.getElementById("lp").value});if(error){document.getElementById("lm").textContent="بيانات الدخول غلط";return}location.reload()}}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  const {data:p}=await sb.from("profiles").select("role,name").eq("id",session.user.id).maybeSingle();
  PROF={role:p?.role||null,name:p?.name||session.user.email,email:session.user.email};
  if(!PROF.role){document.getElementById("app").innerHTML='<div class="empty">حسابك لسه ما اتفعلش. كلّم المدير.</div>';return}
  init();
}

<script>
const TABS=[["home","الرئيسية"],["cars","العربيات"],["book","الحجوزات"],["coll","التحصيلات"],["cust","العملاء"],["acc","الحسابات"],["rep","التقارير"],["maint","الصيانة"],["hold","العهدة"],["log","السجل"],["owners","الملاك"]];
const D={cars:[],customers:[],bookings:[],txns:[],people:[],maint:[],hold:[],log:[],logx:[],owners:[],terms:[]};
let tab="home",db=null,A=null,DL=null,ADM=true,OWN=false,ME={name:"؟"},RC="",AV="list",RO="",RP="m",RY=String(new Date().getFullYear()),BF="all",RALL=false,RM=new Date().toISOString().slice(0,7);
const $=s=>document.querySelector(s);
function dlg(m,btns){return new Promise(r=>{const d=document.createElement("div");d.className="modal";d.style.zIndex=99;d.style.alignItems="center";d.style.padding="20px";
  d.innerHTML=`<div class="sheet" style="border-radius:16px;text-align:center"><p style="white-space:pre-line;font-size:16px;margin:6px 0 4px"></p></div>`;d.querySelector("p").textContent=m;
  btns.forEach(([l,val,cls])=>{const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=l;b.onclick=()=>{d.remove();r(val)};d.firstChild.appendChild(b)});document.body.appendChild(d)})}
window.alert=m=>{dlg(String(m),[["تمام",true]])};
const ask=m=>dlg(m,[["تأكيد",true,"d"],["إلغاء",false,"s"]]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Number(n)||0).toLocaleString("ar-EG");
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)+1);
const byId=(k,id)=>D[k].find(x=>x.id===id);
const pays=b=>b.pays?.length?b.pays:(+b.paid?[{d:b.from,a:+b.paid}]:[]);
const paidOf=b=>pays(b).reduce((s,x)=>s+(+x.a||0),0);
const setPays=(b,arr)=>save('bookings',{...b,pays:arr,paid:arr.reduce((s,x)=>s+(+x.a||0),0)});
const pn=id=>!id?"العهدة":(byId("people",id)?.name||"شخص محذوف");
const recSel=cur=>sel("w","استلمها",[["","العهدة (كاش مع المدير)"],...D.people.map(p=>[p.id,"تحويل إلى: "+p.name])],cur||"");
const needW=()=>false;
const isRented=c=>D.bookings.some(b=>b.car===c.id&&b.status!=="done"&&b.from<=today()&&b.to>=today());

async function init(){
  try{db=await claude.use("db")}catch(e){db=null}
  try{A=await claude.use("assets")}catch(e){}
  try{DL=await claude.use("downloads")}catch(e){}
  try{const u=await claude.use("user");if(u){ADM=await u.canEdit();OWN=await u.isOwner();const m=await u.me();ME={name:m.name||m.email||"؟"}}}catch(e){}
  if(!db){$("#app").innerHTML='<div class="empty">لازم تفتح الصفحة من حساب Claude عشان البيانات تتحفظ وتتشارك مع الفريق.</div>';$("#fab").style.display="none"}
  else for(const k of Object.keys(D)){
    db.collection(k).onSnapshot(s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  }
  render();
}
const sid=o=>{if(!o)return null;const {id:_,...x}=o;return x};
const LBL={cars:"عربية",customers:"عميل",bookings:"حجز",txns:"حركة حسابات",people:"مستلم",maint:"صيانة",hold:"حركة عهدة",owners:"مالك",terms:"عقد مالك"};
const nm=(k,o)=>!o?"":k==="terms"?(byId("cars",o.car)?.name||""):(o.name||o.plate||(k==="bookings"?(byId("customers",o.cust)?.name||"")+" · "+(byId("cars",o.car)?.name||""):"")||o.cat||o.type||o.note||"");
function logIt(k,id,b,a,tag){if(!db)return;const e={t:Date.now(),who:ME.name,col:k,did:id,act:!b?"add":!a?"del":"edit",lbl:(tag||"")+LBL[k]+" — "+nm(k,a||b),b:b?JSON.stringify(b):"",a:a?JSON.stringify(a):""};
  db.collection(["txns","hold","terms","owners"].includes(k)?"logx":"log").doc("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set(e).catch(()=>{})}
const save=(k,o)=>{const id=o.id||("i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5));const r=sid(o);const bef=sid(byId(k,id));return db.collection(k).doc(id).set(r).then(()=>logIt(k,id,bef,r)).catch(()=>alert("تعذر الحفظ — تأكد إن عندك صلاحية التعديل"))};
const del=(k,id)=>ask("متأكد من الحذف؟").then(ok=>{if(!ok)return;const bef=sid(byId(k,id));return db.collection(k).doc(id).delete().then(()=>logIt(k,id,bef,null))});

function totals(){
  const m=today().slice(0,7);
  const inc=D.bookings.reduce((s,b)=>s+paidOf(b),0)+D.txns.filter(t=>t.type==="in").reduce((s,t)=>s+(+t.amt||0),0);
  const exp=D.txns.filter(t=>t.type==="out").reduce((s,t)=>s+(+t.amt||0),0);
  const due=D.bookings.reduce((s,b)=>s+Math.max(0,(+b.total||0)-paidOf(b)),0);
  return{inc,exp,net:inc-exp,due};
}
function render(){
  if(!ADM&&["acc","rep","hold","log","owners"].includes(tab))tab="home";
  $("#nav").innerHTML=TABS.filter(t=>ADM||!["acc","rep","hold","log","owners"].includes(t[0])).map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
  $("#ttl").textContent=TABS.find(t=>t[0]===tab)[1];
  $("#fab").style.display=db&&tab!=="home"&&tab!=="rep"&&tab!=="log"&&tab!=="coll"&&!(tab==="acc"&&AV==="stmt")?"block":"none";
  const f={home:vHome,cars:vCars,book:vBook,coll:vColl,cust:vCust,acc:vAcc,rep:vRep,maint:vMaint,hold:vHold,log:vLog,owners:vOwners}[tab];
  if(db)$("#app").innerHTML=f();
  if(db&&!window._pp&&D.bookings.length){window._pp=1;remindColl()}
}
function vHome(){
  const t=totals(),rented=D.cars.filter(isRented).length;

const dleft=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const curKm=c=>Math.max(+c.odo||0,...D.bookings.filter(b=>b.car===c.id).flatMap(b=>[+b.odoOut||0,+b.odoIn||0]),...D.maint.filter(m=>m.car===c.id).map(m=>+m.km||0));
const lastM=c=>[...D.maint.filter(m=>m.car===c.id)].sort((a,b)=>(b.km-a.km)||(b.date||"").localeCompare(a.date||""))[0];
const nextKm=c=>{const m=lastM(c);return m?(+m.next||0):(+c.svc||0)};
const remKm=c=>{const n=nextKm(c);return n?n-curKm(c):null};
function chkM(id,m){const c=byId("cars",id);if(!c)return;const n=nextKm(c);if(!n)return;const r=n-Math.max(curKm(c),m||0);if(r<=2000)alert("🔧 تنبيه صيانة: "+c.name+(r<=0?"\nمتأخرة عن الصيانة بـ "+fmt(-r)+" كم":"\nباقي على الصيانة "+fmt(r)+" كم"))}
function alerts(){const r=[];
 D.cars.forEach(c=>{[["exp","الرخصة"],["ins","التأمين"]].forEach(([f,k])=>{if(c[f]){const d=dleft(c[f]);if(d<=30)r.push({n:c.name,k,s:d,bad:d<0,t:d<0?"منتهية من "+(-d)+" يوم":"باقي "+d+" يوم"})}});
  const tm=byId("terms",c.id);if(tm?.cEnd){const dd=dleft(tm.cEnd);if(dd<=60)r.push({n:c.name+(tm.owner?" · "+(byId("owners",tm.owner)?.name||""):""),k:"انتهاء عقد المالك",s:dd,bad:dd<0,t:dd<0?"منتهي من "+(-dd)+" يوم":"باقي "+dd+" يوم"})}
  const m=remKm(c);if(m!==null&&m<=2000)r.push({n:c.name,k:"صيانة",s:m,bad:m<=0,t:m<=0?"متأخرة "+fmt(-m)+" كم":"باقي "+fmt(m)+" كم"})});
 D.bookings.forEach(b=>{if(b.status!=="done"){const d=dleft(b.from);if(d>=0&&d<=5)r.push({n:(byId("customers",b.cust)?.name||"؟")+" · "+(byId("cars",b.car)?.name||"؟"),k:"حجز قادم",s:d,bad:false,t:d===0?"يبدأ النهارده":"بعد "+d+" يوم"})}});
 collList().forEach(x=>{if(x.late)r.push({n:x.name,k:"تحصيل متأخر",s:x.d,bad:true,t:"متبقي "+fmt(x.rest)+(x.d<0?" · من "+(-x.d)+" يوم":"")});else if(x.d<=5)r.push({n:x.name,k:"تحصيل قبل نهاية التشغيلة",s:x.d,bad:false,t:"باقي "+x.d+" يوم · متبقي "+fmt(x.rest)})});
 return r.sort((a,b)=>(b.bad-a.bad)||(a.s-b.s))}

async function up(){const f=$("#ph")?.files?.[0];if(!f||!A)return null;try{const bm=await createImageBitmap(f);const k=Math.min(1,1000/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=bm.width*k;c.height=bm.height*k;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));return (await A.upload(b)).id}catch(e){alert("تعذر رفع الصورة");return null}}

  const R=D.bookings.filter(b=>b.car===c.id).reduce((s,b)=>s+pays(b).filter(x=>inPer(x.d)).reduce((q,x)=>q+(+x.a||0),0),0)+D.txns.filter(x=>x.type==="in"&&x.car===c.id&&inPer(x.date)).reduce((s,x)=>s+(+x.amt||0),0);
  const E=D.txns.filter(x=>x.type==="out"&&x.car===c.id&&inPer(x.date)).reduce((s,x)=>s+(+x.amt||0),0);
  const net=R-E,mg=Math.max(0,net)*(+t.pct||0)/100;
  return{R:r2(R),E:r2(E),net:r2(net),mg:r2(mg),own:r2(net-mg),mine:r2(mg),pct:+t.pct||0}}
function carBlock(c){const t=byId("terms",c.id)||{},x=stmt(c),dd=t.cEnd?dleft(t.cEnd):null;
  return `<div style="border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px"><div class="row"><b>${esc(c.name)}</b><button class="sm" onclick="fTerms('${c.id}')">العقد</button></div>
  <div class="mu">${esc(t.cS||"-")} ← ${esc(t.cEnd||"-")} ${dd===null?"":`· <span class="${dd<=60?"r":""}">${dd<0?"منتهي من "+(-dd)+" يوم":"باقي "+dd+" يوم"}</span>`}</div>
  <div class="row" style="margin-top:6px"><span>الإيراد</span><b class="g">${fmt(x.R)}</b></div>
  <div class="row"><span>المصاريف (بتتخصم من الإيراد)</span><b class="r">${fmt(x.E)}</b></div>
  <div class="row"><span>الصافي بعد المصاريف</span><b>${fmt(x.net)}</b></div>
  <div class="row"><span>نسبة الإدارة ${x.pct}% من الصافي</span><b>${fmt(x.mg)}</b></div>
  <div class="row"><span><b>صافي المالك</b></span><b>${fmt(x.own)}</b></div>
  <div class="row"><span><b>نصيبي</b></span><b class="g">${fmt(x.mine)}</b></div></div>`}
function vOwners(){

  const free=D.cars.filter(c=>!byId("owners",byId("terms",c.id)?.owner));
  return ctl+(cards||'<div class="empty">أضف أصحاب العربيات بزرار "+ إضافة"</div>')+(free.length?`<div class="card"><b>عربيات بدون عقد مالك</b>${free.map(c=>`<div class="row" style="margin-top:8px"><span>${esc(c.name)}</span><button class="sm" onclick="fTerms('${c.id}')">+ عقد</button></div>`).join("")}</div>`:"")}

function fTerms(cid){const t=byId("terms",cid)||{},c=byId("cars",cid);

const collList=()=>D.bookings.map(b=>{const rest=r2((+b.total||0)-paidOf(b)),d=dleft(b.to);return{b,rest,d,late:b.status==="done"||d<0,name:(byId("customers",b.cust)?.name||"؟")+" · "+(byId("cars",b.car)?.name||"؟")}}).filter(x=>x.rest>0).sort((a,b)=>a.d-b.d);
function remindColl(){try{const last=+localStorage.getItem("collRemind")||0;if(Date.now()-last<3*864e5)return;

function vColl(){const L=collList(),tot=L.reduce((s,x)=>s+x.rest,0),lt=L.filter(x=>x.late).reduce((s,x)=>s+x.rest,0);
  return `<div class="grid"><div class="stat"><span class="mu">إجمالي المتبقي</span><b class="r">${fmt(tot)}</b></div><div class="stat"><span class="mu">متأخر (انتهت التشغيلة)</span><b class="r">${fmt(lt)}</b></div></div>`+
  (L.map(x=>{const c=byId("customers",x.b.cust);return `<div class="card" ${x.late?'style="border-color:var(--rd)"':""}><div class="row"><b>${esc(c?.name||"؟")}</b><span class="tag ${x.late?"r":""}">${x.late?(x.d<0?"متأخر "+(-x.d)+" يوم":"انتهت وباقي فلوس"):x.d<=5?"تنتهي بعد "+x.d+" يوم":"جارية"}</span></div>
  <div class="mu">${esc(byId("cars",x.b.car)?.name||"؟")} · ${esc(x.b.from)} ← ${esc(x.b.to)}</div>
  <div class="row" style="margin-top:6px"><span class="mu">الإجمالي ${fmt(x.b.total)} · مدفوع ${fmt(paidOf(x.b))}</span><b class="r">متبقي ${fmt(x.rest)}</b></div>
  <div class="row" style="margin-top:8px">${c?.phone?`<a class="sm" href="tel:${esc(c.phone)}" style="text-decoration:none">اتصال</a>`:"<span></span>"}<button class="sm" onclick="pay('${x.b.id}')">+ دفعة</button></div></div>`}).join("")||'<div class="empty">مفيش تحصيلات متبقية 🎉</div>')}
function req(ids,ph){
  const bad=ids.filter(i=>{const e=$("#"+i);return e&&!String(e.value).trim()});
  if(ph!==undefined&&A&&!ph&&!$("#ph")?.files?.length)bad.push("ph");
  [...ids,"ph"].forEach(i=>{const e=$("#"+i);if(e)e.style.borderColor=""});
  if(bad.length){bad.forEach(i=>{const e=$("#"+i);if(e)e.style.borderColor="var(--rd)"});
    alert("لازم تملأ كل الخانات:\n"+bad.map(i=>"• "+(($("#"+i)?.previousElementSibling?.textContent||i).replace(/\(.*?\)/g,"").trim())).join("\n"));return false}
  return true}
function perCtl(){return `<div class="card"><label style="margin-top:0">الفترة</label><select onchange="RP=this.value;render()"><option value="m" ${RP==="m"?"selected":""}>شهر</option><option value="y" ${RP==="y"?"selected":""}>سنة كاملة</option><option value="all" ${RP==="all"?"selected":""}>كل الفترات</option></select>${RP==="m"?`<label>الشهر</label><input type="month" value="${RM}" onchange="RM=this.value||RM;render()">`:RP==="y"?`<label>السنة</label><input type="number" inputmode="numeric" value="${RY}" onchange="RY=String(this.value||RY);render()">`:""}</div>`}
function vStmt(){
  const sumO=o=>Object.values(o).reduce((a,b)=>a+b,0),grp=(type)=>{const o={};D.txns.filter(t=>t.type===type&&inPer(t.date)).forEach(t=>o[t.cat]=r2((o[t.cat]||0)+(+t.amt||0)));return o};
  const rent=r2(D.bookings.reduce((s,b)=>s+pays(b).filter(x=>inPer(x.d)).reduce((q,x)=>q+(+x.a||0),0),0));
  const oth=grp("in"),exc=grp("out"),othT=r2(sumO(oth)),REV=r2(rent+othT),EXP=r2(sumO(exc)),GROSS=r2(REV-EXP);
  const own=D.owners.map(o=>{const cs=D.cars.filter(c=>byId("terms",c.id)?.owner===o.id);return{n:o.name,k:cs.length,v:r2(cs.reduce((s,c)=>s+stmt(c).own,0))}}).filter(x=>x.k);
  const OWN=r2(own.reduce((s,x)=>s+x.v,0)),NET=r2(GROSS-OWN),mar=REV?Math.round(NET/REV*1000)/10:0;
  const H=(n,t)=>`<div style="color:var(--pr);font-weight:700;margin-bottom:6px">${n} ${t}</div>`;
  const L=(a,b,c)=>`<div class="row" style="padding:5px 0"><span>${a}</span><b class="${c||""}">${fmt(b)}</b></div>`;
  const T=(a,b,c)=>`<div class="row" style="border-top:2px solid var(--bd);margin-top:6px;padding-top:8px"><b>${a}</b><b class="${c||""}">${fmt(b)}</b></div>`;
  const cars=D.cars.map(c=>({n:c.name,...stmt(c)}));
  const cR=cars.reduce((s,x)=>s+x.R,0),cE=cars.reduce((s,x)=>s+x.E,0);
  return perCtl()+
  `<div class="card">${H("①","الإيرادات")}${L("إيرادات التأجير (دفعات العملاء)",rent,"g")}${Object.entries(oth).map(([k,v])=>L("إيراد آخر — "+esc(k),v,"g")).join("")}${T("إجمالي الإيرادات",REV,"g")}</div>
  <div class="card">${H("②","المصاريف")}${Object.entries(exc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:5px 0"><span>${esc(k)} <span class="mu">${EXP?Math.round(v/EXP*100):0}%</span></span><b class="r">${fmt(v)}</b></div>`).join("")||'<div class="mu">لا توجد مصاريف</div>'}${T("إجمالي المصاريف",EXP,"r")}</div>
  <div class="card">${H("③","النتيجة قبل حقوق الملاك")}${L("إجمالي الإيرادات",REV)}${L("(−) إجمالي المصاريف",EXP)}${T("الفرق",GROSS,GROSS<0?"r":"g")}</div>
  <div class="card">${H("④","حقوق أصحاب العربيات")}${own.map(x=>L(esc(x.n)+` <span class="mu">(${x.k} عربية)</span>`,x.v)).join("")||'<div class="mu">لا توجد عقود ملاك</div>'}${T("إجمالي حقوق الملاك",OWN)}<div class="mu" style="margin-top:4px">صافي المالك = (إيراد عرباته − مصاريفها) − نسبة الإدارة.</div></div>
  <div class="card" style="border-color:${NET>=0?"var(--gr)":"var(--rd)"};background:${NET>=0?"#16a34a18":"#dc262618"}">${H("⑤",NET>=0?"صافي ربح البيزنس":"صافي خسارة البيزنس")}<div style="font-size:28px;font-weight:800" class="${NET>=0?"g":"r"}">${fmt(NET)}</div><div class="mu">هامش الربح ${mar}% من الإيرادات</div></div>
  <div class="card" style="overflow-x:auto">${H("⑥","التفصيل حسب العربية")}<table><tr><th>العربية</th><th>إيراد</th><th>مصروف</th><th>صافي</th></tr>${cars.map(x=>`<tr><td>${esc(x.n)}</td><td class="g">${fmt(x.R)}</td><td class="r">${fmt(x.E)}</td><td><b>${fmt(r2(x.R-x.E))}</b></td></tr>`).join("")}<tr><td>غير مربوط بعربية</td><td class="g">${fmt(r2(REV-cR))}</td><td class="r">${fmt(r2(EXP-cE))}</td><td><b>${fmt(r2(REV-cR-EXP+cE))}</b></td></tr></table></div>
  ${vRecv(inPer,RP)}
  <div class="mu" style="padding:0 4px 10px">الحسابات على أساس المقبوض فعلاً. لسه متبقي عند العملاء ${fmt(totals().due)} لم يُحصّل بعد.</div>`}
/* forms */
function open(title,body,onSave,delFn){
  $("#md").innerHTML=`<div class="modal"><div class="sheet"><b>${title}</b>${body}<button class="btn" id="sv">حفظ</button>${delFn?'<button class="btn d" id="dl">حذف</button>':""}<button class="btn s" id="cx">إلغاء</button></div></div>`;
  const close=()=>$("#md").innerHTML="";
  $("#cx").onclick=close;$("#sv").onclick=()=>{if(onSave()!==false)close()};
  if(delFn)$("#dl").onclick=()=>{delFn();close()};
}
const v=id=>$("#"+id).value.trim();

function fBook(id){const b=typeof id==="string"?byId("bookings",id):{};
